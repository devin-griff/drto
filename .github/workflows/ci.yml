name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # Pinned so CI formatting matches what the code was formatted with.
      - run: python -m pip install black==24.8.0
      - run: black --check --diff src/ tests/
      - uses: crate-ci/typos@v1.48.0

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      # Bridge until the next pyomo-pounce release: the advanced-step
      # correction (feature 012) needs the estimate-baseline fix merged
      # upstream in jkitchin/pounce#421. Remove alongside the pounce
      # floor bump when the release lands.
      - run: python -m pip install --force-reinstall --no-deps "pyomo-pounce @ git+https://github.com/jkitchin/pounce.git@8a5193dd3b62fb456a11e28f89719978205b6551#subdirectory=pyomo-pounce"
      # drto.scale measures the constraint factors through PyNumero,
      # which calls a compiled ASL library. pyomo builds it from
      # source; download-extensions does not carry it.
      - run: python -m pip install pybind11 setuptools
      # build-extensions attempts every extension and exits nonzero on
      # ones drto does not use (MCPP's source is not distributed), so
      # its status is ignored; the scaling tests fail if the ASL
      # library it does build is missing.
      - run: python -m pyomo.scripting.pyomo_main build-extensions || true
      - run: >
          python -c "from pyomo.common.fileutils import find_library;
          import sys;
          sys.exit(0 if find_library('pynumero_ASL') else 'pynumero_ASL was not built')"
      - run: python -m pytest -q --cov=drto --cov-report=term-missing

  import-base:
    # The package must import with only its base (non-dev) dependencies.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python -c "import drto; print('drto', drto.__version__)"

  min-deps:
    # Exercise the declared floor: oldest supported Python and minimum Pyomo.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - run: python -m pip install -e ".[dev]"
      # Bridge until the next pyomo-pounce release: the advanced-step
      # correction (feature 012) needs the estimate-baseline fix merged
      # upstream in jkitchin/pounce#421. Remove alongside the pounce
      # floor bump when the release lands.
      - run: python -m pip install --force-reinstall --no-deps "pyomo-pounce @ git+https://github.com/jkitchin/pounce.git@8a5193dd3b62fb456a11e28f89719978205b6551#subdirectory=pyomo-pounce"
      - run: python -m pip install "pyomo==6.8.1"
      # drto.scale measures the constraint factors through PyNumero,
      # which calls a compiled ASL library. pyomo builds it from
      # source; download-extensions does not carry it.
      - run: python -m pip install pybind11 setuptools
      # build-extensions attempts every extension and exits nonzero on
      # ones drto does not use (MCPP's source is not distributed), so
      # its status is ignored; the scaling tests fail if the ASL
      # library it does build is missing.
      - run: python -m pyomo.scripting.pyomo_main build-extensions || true
      - run: >
          python -c "from pyomo.common.fileutils import find_library;
          import sys;
          sys.exit(0 if find_library('pynumero_ASL') else 'pynumero_ASL was not built')"
      - run: python -m pytest -q

  docs:
    # Build the Sphinx docs, warnings-as-errors, the same as the local build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[docs]"
      - run: python -m sphinx -b html -W --keep-going docs docs/_build/html
