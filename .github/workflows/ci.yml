name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # Pinned so CI formatting matches what the code was formatted with.
      - run: python -m pip install black==24.8.0
      - run: black --check --diff src/ tests/
      - uses: crate-ci/typos@v1.48.0

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      # pyomo's cmake builder imports setuptools, which the 3.10 and
      # 3.11 environments already carry and the 3.12 one does not.
      - run: python -m pip install setuptools
      # drto.scale measures the constraint factors through PyNumero,
      # which calls a compiled ASL library; download-extensions does not
      # carry it, so pyomo builds it from source. This builds that
      # library and nothing else: build-extensions also builds the AMPL
      # demo and cubic spline libraries and attempts MCPP, whose source
      # is not distributed, taking 73 s against 8 s and exiting nonzero
      # either way (gh #76).
      - run: python -c "from pyomo.contrib.pynumero.build import build_pynumero; build_pynumero()"
      - run: python -m pytest -q --cov=drto --cov-report=term-missing

  import-base:
    # The package must import with only its base (non-dev) dependencies.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python -c "import drto; print('drto', drto.__version__)"

  min-deps:
    # Exercise the declared floor: oldest supported Python and minimum Pyomo.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pip install "pyomo==6.10.1"
      # pyomo's cmake builder imports setuptools: 3.10 carries it, but
      # the step should not depend on the floor being that version.
      - run: python -m pip install setuptools
      # drto.scale measures the constraint factors through PyNumero,
      # which calls a compiled ASL library; download-extensions does not
      # carry it, so pyomo builds it from source. This builds that
      # library and nothing else: build-extensions also builds the AMPL
      # demo and cubic spline libraries and attempts MCPP, whose source
      # is not distributed, taking 73 s against 8 s and exiting nonzero
      # either way (gh #76).
      - run: python -c "from pyomo.contrib.pynumero.build import build_pynumero; build_pynumero()"
      - run: python -m pytest -q

  docs:
    # Build the Sphinx docs, warnings-as-errors, the same as the local build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[docs]"
      - run: python -m sphinx -b html -W --keep-going docs docs/_build/html
